<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyMail</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="mail-card">
    <div class="logo">M</div>

    <h1>MyMail</h1>

    <p class="subtitle">
      Connect your email account and view your inbox in one place.
    </p>

    <a class="login-button google" href="/auth/google">
      Continue with Google
    </a>

    <button class="login-button provider" id="providerButton">
      Connect another provider
    </button>

    <div class="status-box" id="statusBox">
      Checking server...
    </div>
  </main>

  <script>
    const statusBox = document.getElementById("statusBox");
    const providerButton = document.getElementById("providerButton");

    fetch("/api/health")
      .then(response => {
        if (!response.ok) {
          throw new Error("Server returned " + response.status);
        }

        return response.json();
      })
      .then(() => {
        statusBox.textContent = "Server is online";
      })
      .catch(error => {
        statusBox.textContent = "Server connection failed: " + error.message;
      });

    providerButton.addEventListener("click", () => {
      alert("Provider login is not configured yet.");
    });
  </script>
</body>
</html>
